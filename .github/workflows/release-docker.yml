name: release-docker
on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:

      - uses: actions/checkout@v7
        with:
          path: unlock-patch

      - name: Clone origin and apply patches
        run: |
          git config --global core.autocrlf false
          git clone --branch ${{ github.event.inputs.version }} --depth=1 https://github.com/n8n-io/n8n.git
      - name: Apply patch
        run: |          
          cd n8n
          git apply ${{ github.workspace }}/unlock-patch/license-stub.patch
      - name: Check status
        run: |  
          cd n8n 
          git status

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # sanad: ref=v6.0.9
        with:
          version: 11
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # sanad: ref=v7.0.0
        with:
          node-version: 24.16.0
          cache: 'pnpm'
          cache-dependency-path: './n8n/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd n8n
          pnpm install --frozen-lockfile

      - name: Build n8n
        run: |
          cd n8n
          pnpm build:n8n


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # sanad: ref=v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

 
      - name: Strip n8n@ prefix from version
        id: clean-version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version=${VERSION#n8n@}" >> $GITHUB_OUTPUT

      - name: Build and push n8n Docker image
        id: build-n8n
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: ./n8n
          file: ./n8n/docker/images/n8n/Dockerfile
          build-args: |
            NODE_VERSION=24.18.0
            N8N_VERSION=${{ steps.clean-version.outputs.version }}
            N8N_RELEASE_TYPE=stable
          push: true
          tags: ahmgam/n8n:${{ steps.clean-version.outputs.version }}
